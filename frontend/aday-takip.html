<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERNASA Aday Takip Sistemi</title>
    <link rel="stylesheet" href="/static/ik.css">
</head>

<body>

<main class="page">
    <section class="portal-panel">
    <header class="topbar">

    <div class="brand-area">

        <div class="brand-logo">
            E
        </div>

        <div>
            <h1>ERNASA Aday Takip Sistemi</h1>
            <p>Yapay Zekâ Destekli Aday Yönetim Merkezi</p>
        </div>

    </div>

    <a href="/ik" class="candidate-link">
        İK Portalına Dön
    </a>

</header>
    <section class="analysis-card">
    <div class="section-heading">
        <div class="step-badge">1</div>

        <div>
            <h2>Aday Takip Merkezi</h2>
            <p>Adayları arayın, mülakat durumlarını takip edin ve tamamlanan raporları görüntüleyin.</p>
        </div>
    </div>

        <div class="form-grid">
            <input
                type="text"
                id="candidateSearch"
                placeholder="Aday adı, aday numarası veya pozisyon ara..."
            >

            <select id="statusFilter">
                <option value="">Tüm Durumlar</option>
                <option value="waiting">Bekliyor</option>
                <option value="opened">Link Açıldı</option>
                <option value="started">Mülakat Başladı</option>
                <option value="completed">Tamamlandı</option>
                <option value="expired">Süresi Doldu</option>
            </select>
        </div>

        <div class="analysis-result" style="margin-top:16px;">
    <strong>Aday Özeti</strong>
    <div id="candidateSummary" style="margin-top:8px;">
        Toplam aday: -
    </div>
</div>

        <div id="candidateList">
            Adaylar yükleniyor...
        </div>
        </section>
    </section>
</main>

<script src="/static/aday-takip.js"></script>

</body>
</html>
