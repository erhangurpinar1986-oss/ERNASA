name: ERNASA Training Demo Cleanup Safety
on:
  pull_request:
    paths:
      - "training_demo_cleanup_20261120.py"
      - "backend/main.py"
      - "tests/test_candidate_experience.py"
      - ".github/workflows/training-demo-maintenance.yml"
  workflow_dispatch:
concurrency:
  # Cancel superseded runs of the same PR (a newer push will run every check again).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile training_demo_cleanup_20261120.py backend/main.py
      - run: python -m pytest tests/test_candidate_experience.py tests/test_academy_v9_integration.py -q
