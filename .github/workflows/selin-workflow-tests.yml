name: ERNASA SELIN end-to-end candidate workflow checks
on:
  pull_request:
    paths:
      - 'selin_workflow.py'
      - 'ats_public_cv.py'
      - 'frontend/ats_application.html'
      - 'tests/test_ats_public_cv.py'
      - 'backend/main.py'
      - 'tests/test_selin_workflow.py'
      - '.github/workflows/selin-workflow-tests.yml'
  workflow_dispatch:
jobs:
  selin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_selin_workflow.py tests/test_ats_public_cv.py -q
      - run: python -m pytest tests/test_academy_assignments.py tests/test_candidate_experience.py tests/test_ats_cv_match_integration.py -q
