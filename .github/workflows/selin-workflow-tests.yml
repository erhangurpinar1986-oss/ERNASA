name: ERNASA HR FLOW end-to-end candidate workflow checks
on:
  pull_request:
    paths:
      - 'services/ai_service.py'
      - 'tests/test_ai_service_privacy.py'
      - 'selin_workflow.py'
      - 'hr_flow_screening.py'
      - 'hr_flow_contacts.py'
      - 'frontend/ats_suite.js'
      - 'tests/test_hr_flow_browser.py'
      - 'frontend/ernasa_v5_ik.html'
      - 'frontend/saas_portal.js'
      - 'ats_public_cv.py'
      - 'frontend/ats_application.html'
      - 'tests/test_ats_public_cv.py'
      - 'backend/main.py'
      - 'tests/test_selin_workflow.py'
      - '.github/workflows/selin-workflow-tests.yml'
  workflow_dispatch:
jobs:
  selin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_selin_workflow.py tests/test_ats_public_cv.py tests/test_ai_service_privacy.py -q
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_hr_flow_browser.py -q
      - run: node --check frontend/ats_suite.js
      - run: node --check frontend/saas_portal.js
      - run: python -m pytest tests/test_academy_assignments.py tests/test_candidate_experience.py tests/test_ats_cv_match_integration.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hr-flow-real-chromium-ui
          path: artifacts/ernasa_hr_flow_chromium_ui.png
          if-no-files-found: ignore
