name: ERNASA ATS four-demo cleanup safety
on:
  pull_request:
    paths:
      - "ats_demo_cleanup_20261120.py"
      - "backend/main.py"
      - "tests/test_candidate_experience.py"
      - ".github/workflows/ats-demo-maintenance.yml"
  workflow_dispatch:
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile ats_demo_cleanup_20261120.py backend/main.py
      - run: python -m pytest tests/test_candidate_experience.py tests/test_ats_cv_match_integration.py -q
