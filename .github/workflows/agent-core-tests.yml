name: ERNASA Agents offline approval checks
on:
  pull_request:
    paths:
      - 'control/agent_*.py'
      - 'tests/test_agent_core.py'
      - '.github/workflows/agent-core-tests.yml'
  workflow_dispatch:
jobs:
  agent_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling and existing CONTROL dependency
        run: python -m pip install pytest
      - name: Run offline synthetic agent tests
        run: python -m pytest tests/test_agent_core.py -q
