name: Resend read-only diagnostic tests
on:
  pull_request:
    paths:
      - services/invite_email.py
      - backend/main.py
      - tests/test_invite_email.py
      - .github/workflows/resend-diagnostics-tests.yml
concurrency:
  # Cancel superseded runs of the same PR (a newer push will run every check again).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-resend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile safe mail diagnostic and backend
        run: python -m py_compile services/invite_email.py backend/main.py
      - name: Run isolated email tests
        run: python -m unittest discover -s tests -p test_invite_email.py -v
